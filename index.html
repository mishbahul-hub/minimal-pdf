<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal PDF</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <main id="pages"></main>
    <div id="message" hidden></div>
    <div id="indicator"></div>

    <form id="goto" class="panel" hidden>
      <label>
        Go to page
        <input id="goto-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" />
        <span id="goto-total"></span>
      </label>
    </form>

    <form id="search" class="panel" hidden>
      <input id="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
      <span id="search-status" aria-live="polite"></span>
    </form>

    <nav id="outline" class="panel" hidden aria-label="Table of contents">
      <h2>Contents</h2>
      <div id="outline-tree"></div>
    </nav>

    <div id="help" hidden>
      <div class="panel">
        <h2>Keyboard shortcuts</h2>
        <dl id="help-list"></dl>
      </div>
    </div>
  </body>
</html>
