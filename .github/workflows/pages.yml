# Publishes the website in site/ (with the README screenshots and the app icon) to GitHub Pages:
# https://mishbahul-hub.github.io/minimal-pdf/
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p public/screenshots
          cp site/* public/
          cp docs/screenshots/*.webp public/screenshots/
          cp src-tauri/icons/128x128@2x.png public/icon.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
